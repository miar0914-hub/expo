<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[관리자 편집용] 2026 찾아가는 고교학점제 1:1 컨설팅 배정 관리</title>
    <style>
        :root {
            --navy: #1e3a8a;
            --navy-dark: #0f172a;
            --blue: #2563eb;
            --blue-light: #eff6ff;
            --blue-border: #bfdbfe;
            --teal: #0f766e;
            --teal-light: #f0fdfa;
            --amber: #d97706;
            --amber-light: #fffbeb;
            --green: #15803d;
            --green-light: #f0fdf4;
            --rose: #e11d48;
            --gray-900: #0f172a;
            --gray-800: #1e293b;
            --gray-700: #334155;
            --gray-600: #475569;
            --gray-500: #64748b;
            --gray-300: #cbd5e1;
            --gray-200: #e2e8f0;
            --gray-100: #f1f5f9;
            --gray-50: #f8fafc;
        }

        * {
            box-sizing: border-box;
            word-break: keep-all;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            line-height: 1.5;
        }

        /* ================= 잠금 화면 ================= */
        .lock-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #0f766e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .lock-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 34px 30px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .lock-badge {
            display: inline-block;
            background: var(--blue-light);
            color: var(--navy);
            font-size: 12px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .lock-card h1 {
            margin: 0 0 8px 0;
            font-size: 21px;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .lock-card p {
            margin: 0 0 22px 0;
            font-size: 13.5px;
            color: var(--gray-600);
        }
        .code-input {
            width: 100%;
            padding: 14px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 10px;
            text-align: center;
            border: 2px solid var(--gray-300);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.15s;
        }
        .code-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .lock-remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--gray-600);
            cursor: pointer;
        }
        .lock-btn {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: var(--navy);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s;
        }
        .lock-btn:hover {
            background: var(--blue);
        }
        .lock-error {
            color: var(--rose);
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ================= 상단 헤더 & 네비게이션 ================= */
        .top-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #ffffff;
            padding: 18px 20px 14px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.18);
        }
        .header-inner {
            max-width: 1380px;
            margin: 0 auto;
        }
        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .brand-pill {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .brand-title h1 {
            margin: 0;
            font-size: 18.5px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }
        .sync-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #d1fae5;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.13);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.24);
        }

        .nav-bars-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .school-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .school-tab {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .school-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .school-tab.active {
            background: #ffffff;
            color: var(--navy-dark);
            border-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }
        .school-tab .cnt {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 11px;
            background: rgba(15, 23, 42, 0.1);
        }
        .school-tab:not(.active) .cnt {
            background: rgba(255, 255, 255, 0.15);
        }

        .mode-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.45);
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
            flex-wrap: wrap;
        }
        .mode-tab {
            background: transparent;
            color: #cbd5e1;
            border: none;
            padding: 7px 13px;
            border-radius: 7px;
            font-size: 12.8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mode-tab.active {
            background: #3b82f6;
            color: #ffffff;
        }
        .mode-tab.edit-tab.active {
            background: #f59e0b;
            color: #0f172a;
        }

        /* ================= 본문 레이아웃 ================= */
        .main-wrap {
            max-width: 1380px;
            margin: 0 auto;
            padding: 20px 18px 80px;
        }

        /* 학교 요약 배너 */
        .school-banner {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
        .school-banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .school-date-chip {
            background: var(--blue-light);
            color: var(--navy);
            border: 1px solid var(--blue-border);
            font-weight: 800;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .school-banner-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .school-banner-meta {
            font-size: 13.5px;
            color: var(--gray-600);
        }
        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            border: 1px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-800);
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .btn:hover {
            border-color: var(--blue);
            color: var(--blue);
            background: var(--blue-light);
        }
        .btn-primary {
            background: var(--navy);
            color: #ffffff;
            border-color: var(--navy);
        }
        .btn-primary:hover {
            background: var(--blue);
            border-color: var(--blue);
            color: #ffffff;
        }
        .btn-teal {
            background: var(--teal);
            color: #ffffff;
            border-color: var(--teal);
        }
        .btn-teal:hover {
            background: #0d9488;
            color: #ffffff;
        }

        /* ================= 뷰 1: 교사용 상담 카드 뷰 ================= */
        .teacher-selector-card {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 18px;
        }
        .selector-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--gray-600);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .teacher-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .teacher-chip {
            border: 1.5px solid var(--gray-200);
            background: var(--gray-50);
            color: var(--gray-800);
            padding: 9px 15px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .teacher-chip:hover {
            border-color: var(--blue);
            background: var(--blue-light);
        }
        .teacher-chip.active {
            background: var(--navy);
            color: #ffffff;
            border-color: var(--navy);
            box-shadow: 0 3px 10px rgba(30, 58, 138, 0.22);
        }
        .teacher-chip .subj {
            font-size: 11.5px;
            font-weight: 600;
            opacity: 0.82;
        }
        .teacher-chip .badge-cnt {
            background: rgba(15, 23, 42, 0.09);
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 11.5px;
        }
        .teacher-chip.active .badge-cnt {
            background: rgba(255, 255, 255, 0.22);
        }

        .progress-bar-row {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-700);
        }
        .progress-track {
            flex: 1;
            height: 9px;
            background: var(--gray-200);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .teacher-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 22px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--navy);
        }
        .teacher-section-header h2 {
            margin: 0;
            font-size: 17px;
            color: var(--navy);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
        }
        @media (max-width: 500px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .consult-card {
            background: #ffffff;
            border: 1.5px solid var(--gray-200);
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.15s;
            position: relative;
        }
        .consult-card.done {
            background: #f8fafc;
            border-color: #86efac;
            opacity: 0.86;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .student-head {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .slot-pill {
            background: var(--navy);
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 7px;
        }
        .student-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .student-classno {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--gray-600);
        }
        .done-toggle {
            border: 1.5px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-600);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .done-toggle.checked {
            background: var(--green-light);
            border-color: #22c55e;
            color: var(--green);
        }

        .track-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .track-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--blue-light);
            color: var(--navy);
        }
        .track-t1 { background: #eff6ff; color: #1d4ed8; }
        .track-t2 { background: #ecfeff; color: #0e7490; }
        .track-t3 { background: #f0fdf4; color: #15803d; }
        .track-t4 { background: #fdf2f8; color: #be185d; }
        .track-t5 { background: #f5f3ff; color: #6d28d9; }
        .track-t6 { background: #fff7ed; color: #c2410c; }
        .track-t7 { background: #f1f5f9; color: #475569; }

        .info-block {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13.2px;
        }
        .info-row {
            margin-bottom: 6px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-key {
            font-weight: 800;
            color: var(--gray-600);
            margin-right: 6px;
        }
        .job-highlight {
            font-weight: 800;
            color: var(--navy);
        }

        .question-box {
            background: var(--amber-light);
            border: 1.5px solid #fde68a;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13.5px;
            color: #78350f;
        }
        .question-box.empty {
            background: var(--gray-50);
            border: 1px dashed var(--gray-300);
            color: var(--gray-500);
            padding: 8px 12px;
            font-size: 12.5px;
        }
        .question-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #b45309;
            margin-bottom: 4px;
            display: block;
        }

        .memo-input {
            width: 100%;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 12.5px;
            font-family: inherit;
            background: #ffffff;
            color: var(--gray-800);
            resize: none;
        }
        .memo-input:focus {
            outline: none;
            border-color: var(--blue);
        }

        /* ================= 뷰 2: 전체 배정표 & 대기실 안내 뷰 ================= */
        .subview-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .subview-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .subview-pill {
            border: 1.5px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-700);
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .subview-pill.active {
            background: var(--navy);
            color: #ffffff;
            border-color: var(--navy);
        }
        .search-input {
            padding: 8px 13px;
            border: 1.5px solid var(--gray-300);
            border-radius: 9px;
            font-size: 13px;
            min-width: 220px;
        }

        /* 부스 매트릭스 그리드 */
        .booth-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        @media (max-width: 1100px) {
            .booth-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 640px) {
            .booth-grid {
                grid-template-columns: 1fr;
            }
        }
        .booth-card {
            background: #ffffff;
            border: 1.5px solid var(--gray-200);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
        .booth-head {
            background: var(--navy);
            color: #ffffff;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .booth-num {
            font-size: 11.5px;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
        }
        .booth-teacher {
            font-size: 15.5px;
            font-weight: 800;
        }
        .booth-list {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .booth-slot-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
        }
        .booth-slot-no {
            background: var(--blue-light);
            color: var(--navy);
            font-weight: 800;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            min-width: 44px;
            text-align: center;
        }
        .booth-st-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .booth-st-name {
            font-weight: 800;
            font-size: 14px;
            color: var(--gray-900);
        }
        .booth-st-class {
            font-size: 12.5px;
            color: var(--gray-600);
            font-weight: 700;
        }

        /* 반·번호순 전체 테이블 */
        .table-card {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
        table.roster-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table.roster-table th {
            background: var(--gray-100);
            color: var(--gray-900);
            font-weight: 800;
            padding: 11px 10px;
            border-bottom: 2px solid var(--gray-300);
            text-align: center;
            white-space: nowrap;
        }
        table.roster-table td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--gray-200);
            vertical-align: middle;
        }
        table.roster-table tr:hover td {
            background: #f8fafc;
        }
        .td-center { text-align: center; white-space: nowrap; }

        /* 전자칠판 전체화면 대기실 안내 모드 */
        body.projector-mode {
            background: #0f172a;
        }
        body.projector-mode .top-header,
        body.projector-mode .school-banner .action-group,
        body.projector-mode .subview-bar {
            display: none !important;
        }
        body.projector-mode .main-wrap {
            max-width: 100%;
            padding: 18px 24px;
        }
        body.projector-mode .school-banner {
            background: #1e293b;
            border-color: #334155;
            color: #ffffff;
        }
        body.projector-mode .school-banner-title {
            color: #ffffff;
            font-size: 24px;
        }
        body.projector-mode .school-banner-meta {
            color: #cbd5e1;
            font-size: 16px;
        }
        .projector-exit-btn {
            display: none;
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }
        body.projector-mode .projector-exit-btn {
            display: inline-flex;
        }

// ================= 구글 시트 실시간 연동 (JSONP) =================
function serializeMapping(list) {
    const sorted = [...list].sort((a, b) => a.id.localeCompare(b.id, "ko"));
    return "|" + sorted.map(s => `${s.id}:${s.teacher}:${s.slot}`).join("|") + "|";
}

function hasUnsavedChanges() {
    return serializeMapping(studentsData) !== savedSnapshotStr;
}

function syncFromGoogleSheet(manualNotify = false) {
    if (hasUnsavedChanges() && manualNotify) {
        if (!confirm("저장하지 않은 배정 편집 내역이 있습니다. 시트의 최신 데이터로 덮어쓰시겠습니까?")) {
            return;
        }
    }
    const cbName = "__gvizCb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(() => {
        cleanup();
        setSyncStatus("내장 데이터 표시 중 (오프라인)", false);
    }, 8000);

    function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(resp) {
        cleanup();
        try {
            if (!resp || resp.status !== "ok" || !resp.table || !resp.table.rows) {
                throw new Error("Invalid response");
            }
            const parsed = [];
            const nextRecords = {};
            for (const rowObj of resp.table.rows) {
                const c = rowObj.c || [];
                const val = idx => (c[idx] && c[idx].v !== null && c[idx].v !== undefined) ? c[idx].v : "";
                const dateStr = String(val(0)).trim();
                const school = String(val(1)).trim();
                const teacher = String(val(2)).trim();
                const slot = Math.round(Number(val(3)) || 1);
                const sClass = Math.round(Number(val(4)) || 1);
                const sNo = Math.round(Number(val(5)) || 1);
                const name = String(val(6)).trim();
                const track = String(val(7)).trim();
                const job = String(val(8)).trim();
                const worries = String(val(9)).trim();
                const question = String(val(10)).trim() || "-";
                const id = String(val(11)).trim() || `${school}-${sClass}-${sNo}`;
                const doneCol = String(val(12)).trim();
                const memoCol = String(val(13) || "").replace(/^'/, "");
                if (school && name) {
                    parsed.push({
                        id, date: dateStr, school, teacher, slot,
                        class: sClass, no: sNo, name, track, job, worries, question
                    });
                    nextRecords[id] = { done: doneCol === "완료", memo: memoCol };
                }
            }
            if (parsed.length > 0) {
                window.__srvMemoRecords = nextRecords;
                // 방금 저장한 직후 구글 시트 반영 대기 중인 로컬 스냅샷 확인
                const pendingRaw = sessionStorage.getItem("expo_pending_save");
                if (pendingRaw && !manualNotify) {
                    const pending = JSON.parse(pendingRaw);
                    if (Date.now() - pending.ts < 15000) {
                        const sheetSnap = serializeMapping(parsed);
                        if (sheetSnap === pending.snap) {
                            sessionStorage.removeItem("expo_pending_save");
                        } else {
                            // 아직 시트 수식 재계산 중이면 로컬 최신 상태 유지
                            setSyncStatus("구글 시트 실시간 연동됨", true);
                            return;
                        }
                    } else {
                        sessionStorage.removeItem("expo_pending_save");
                    }
                }
                studentsData = parsed;
                savedSnapshotStr = serializeMapping(studentsData);
                updateSaveBar();
                renderAll();
                setSyncStatus("구글 시트 실시간 연동됨", true);
                if (manualNotify) showToast("✅ 구글 시트에서 최신 배정 데이터를 불러왔습니다.");
            }
        } catch (err) {
            console.error(err);
            setSyncStatus("기본 데이터 표시 중", false);
        }
    };

    script.onerror = function() {
        cleanup();
        setSyncStatus("오프라인 백업 데이터 사용 중", false);
    };
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&gid=${MATCH_GID}&_ts=${Date.now()}`;
    document.body.appendChild(script);
}

function setSyncStatus(msg, ok) {
    const badge = document.getElementById("syncStatusBadge");
    const txt = document.getElementById("syncStatusText");
    txt.textContent = msg;
    badge.style.background = ok ? "rgba(16, 185, 129, 0.18)" : "rgba(245, 158, 11, 0.22)";
}

// ================= 구글 시트 덮어쓰기 저장 (B안) =================
async function saveToGoogleSheet() {
    const btn = document.getElementById("btnSaveSheet");
    btn.disabled = true;
    btn.textContent = "⏳ 구글 시트에 저장 중...";

    // 각 학교·교사별 순번(1..N) 정규화
    normalizeAllSlots();
    const snap = serializeMapping(studentsData);

    const payload = {
        name: "매칭저장",
        subject: "배정업데이트",
        participation: currentSchool,
        schools: currentSchool,
        track: snap
    };

    try {
        await fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        });

        savedSnapshotStr = snap;
        sessionStorage.setItem("expo_pending_save", JSON.stringify({ ts: Date.now(), snap }));
        selectedStudentId = null;
        updateSaveBar();
        renderAll();
        showToast("✅ 구글 스프레드시트 '매칭_배정표'에 저장되었습니다!");

        // 2초 후 시트 반영 검증
        setTimeout(() => syncFromGoogleSheet(false), 2200);
    } catch (err) {
        console.error(err);
        alert("저장 중 네트워크 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.");
    } finally {
        btn.disabled = false;
        btn.textContent = "💾 구글 시트에 덮어쓰기 저장";
    }
}

function discardEdits() {
    if (!confirm("편집한 배정 변경사항을 모두 취소하고 저장된 상태로 되돌리시겠습니까?")) return;
    selectedStudentId = null;
    sessionStorage.removeItem("expo_pending_save");
    syncFromGoogleSheet(false);
}

function normalizeAllSlots() {
    for (const sc of SCHOOL_ORDER) {
        const teachers = getSchoolTeachers(sc);
        for (const t of teachers) {
            const list = studentsData
                .filter(s => s.school === sc && s.teacher === t.name)
                .sort((a, b) => a.slot - b.slot || a.class - b.class || a.no - b.no);
            list.forEach((s, i) => {
                s.slot = i + 1;
            });
        }
    }
}

// ================= 유틸리티 & 상태 헬퍼 =================
function getSchoolTeachers(school) {
    return TEACHERS.filter(t => t.schools[school]);
}

function getSchoolStudents(school) {
    const tOrder = {};
    TEACHERS.forEach((t, i) => { tOrder[t.name] = i; });
    return studentsData
        .filter(s => s.school === school)
        .sort((a, b) => (tOrder[a.teacher] ?? 99) - (tOrder[b.teacher] ?? 99) || a.slot - b.slot);
}

function getTrackClass(track) {
    if (track.includes("①")) return "track-t1";
    if (track.includes("②")) return "track-t2";
    if (track.includes("③")) return "track-t3";
    if (track.includes("④")) return "track-t4";
    if (track.includes("⑤")) return "track-t5";
    if (track.includes("⑥")) return "track-t6";
    return "track-t7";
}

function escapeHtml(str) {
    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function getSrvRecord(studentId) {
    const map = window.__srvMemoRecords || {};
    return map[studentId] || { done: false, memo: "" };
}

function pushAdminMemo(studentId, doneVal, memoVal) {
    window.__srvMemoRecords = window.__srvMemoRecords || {};
    const clean = String(memoVal || "").trim();
    window.__srvMemoRecords[studentId] = { done: !!doneVal, memo: clean };
    const safeTrack = /^[=+\-@']/.test(clean) ? ("'" + clean) : clean;
    fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
            name: "상담메모",
            subject: studentId,
            participation: doneVal ? "완료" : "미완료",
            schools: doneVal ? "완료" : "미완료",
            track: safeTrack
        })
    }).catch(() => {});
}

function isDone(studentId) {
    return getSrvRecord(studentId).done;
}

function toggleDone(studentId) {
    const cur = getSrvRecord(studentId);
    pushAdminMemo(studentId, !cur.done, cur.memo);
    renderAll();
}

function getMemo(studentId) {
    return getSrvRecord(studentId).memo;
}

const __adminMemoTimers = {};
function saveMemo(studentId, val) {
    window.__srvMemoRecords = window.__srvMemoRecords || {};
    const cur = getSrvRecord(studentId);
    window.__srvMemoRecords[studentId] = { done: cur.done, memo: val };
    clearTimeout(__adminMemoTimers[studentId]);
    __adminMemoTimers[studentId] = setTimeout(() => {
        pushAdminMemo(studentId, getSrvRecord(studentId).done, val);
    }, 1200);
}

function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

// ================= 네비게이션 전환 =================
function selectSchool(sc) {
    currentSchool = sc;
    try { localStorage.setItem("expo_selected_school", sc); } catch (e) {}
    selectedStudentId = null;

    // 현재 선택된 선생님이 해당 학교에 없으면 전체 보기로 자동 전환
    const avail = getSchoolTeachers(sc).map(t => t.name);
    if (currentTeacher !== "ALL" && !avail.includes(currentTeacher)) {
        currentTeacher = "ALL";
    }
    renderAll();
}

function setViewMode(mode) {
    if (document.body.classList.contains("projector-mode")) {
        document.body.classList.remove("projector-mode");
    }
    currentMode = mode;
    selectedStudentId = null;
    document.querySelectorAll(".mode-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
    });
    renderAll();
}

function selectTeacher(tName) {
    currentTeacher = tName;
    try { localStorage.setItem("expo_selected_teacher", tName); } catch (e) {}
    renderView();
}

function toggleProjectorMode() {
    if (currentMode !== "overview") {
        setViewMode("overview");
    }
    overviewSubmode = "booth";
    document.body.classList.toggle("projector-mode");
    renderView();
}

function updateSaveBar() {
    const bar = document.getElementById("saveBar");
    if (hasUnsavedChanges()) {
        bar.classList.add("visible");
        document.getElementById("saveBarText").textContent = "✏️ 배정이 변경되었습니다. 확인 후 구글 시트에 저장해 주세요!";
    } else {
        bar.classList.remove("visible");
    }
}

// ================= 렌더링 메인 =================
function renderAll() {
    renderSchoolTabs();
    renderSchoolBanner();
    renderView();
    updateSaveBar();
}

function renderSchoolTabs() {
    const wrap = document.getElementById("schoolTabs");
    wrap.innerHTML = SCHOOL_ORDER.map(sc => {
        const cnt = studentsData.filter(s => s.school === sc).length;
        const info = SCHOOL_INFO[sc];
        const active = sc === currentSchool ? "active" : "";
        return `<button type="button" class="school-tab ${active}" onclick="selectSchool('${sc}')">
            ${info.date} ${sc} <span class="cnt">${cnt}명</span>
        </button>`;
    }).join("");
}

function renderSchoolBanner() {
    const info = SCHOOL_INFO[currentSchool];
    const teachers = getSchoolTeachers(currentSchool);
    const students = getSchoolStudents(currentSchool);
    document.getElementById("bannerDate").textContent = `📅 ${info.date} ${info.time}`;
    document.getElementById("bannerTitle").textContent = `${info.fullName} 1:1 진로·학업설계 컨설팅`;
    document.getElementById("bannerMeta").textContent = `참여 교사 ${teachers.length}명 · 사전설문 학생 ${students.length}명 · 장소: ${info.place}`;

    const projBtn = document.getElementById("btnProjectorToggle");
    projBtn.style.display = (currentMode === "overview") ? "inline-flex" : "none";
}

function renderView() {
    const container = document.getElementById("viewContainer");
    if (currentMode === "cards") {
        renderCardsView(container);
    } else if (currentMode === "overview") {
        renderOverviewView(container);
    } else {
        renderEditView(container);
    }
}

// ================= 뷰 1: 교사용 상담 카드 렌더링 =================
function renderCardsView(container) {
    const teachers = getSchoolTeachers(currentSchool);
    const schoolStudents = getSchoolStudents(currentSchool);

    const targetStudents = currentTeacher === "ALL"
        ? schoolStudents
        : schoolStudents.filter(s => s.teacher === currentTeacher);

    const doneCount = targetStudents.filter(s => isDone(s.id)).length;
    const pct = targetStudents.length ? Math.round((doneCount / targetStudents.length) * 100) : 0;

    let html = `
    <div class="teacher-selector-card">
        <div class="selector-label">
            <span>👩‍🏫 상담 교사 선택 (성함을 누르면 담당 학생 카드만 모아봅니다)</span>
            <span>상담 진행률: ${doneCount} / ${targetStudents.length}명 (${pct}%)</span>
        </div>
        <div class="teacher-chips">
            <button type="button" class="teacher-chip ${currentTeacher === 'ALL' ? 'active' : ''}" onclick="selectTeacher('ALL')">
                전체 교사 보기 <span class="badge-cnt">${schoolStudents.length}명</span>
            </button>
            ${teachers.map(t => {
                const cnt = schoolStudents.filter(s => s.teacher === t.name).length;
                const active = currentTeacher === t.name ? "active" : "";
                return `<button type="button" class="teacher-chip ${active}" onclick="selectTeacher('${t.name}')">
                    ${t.name} 선생님 <span class="badge-cnt">${cnt}명</span>
                </button>`;
            }).join("")}
        </div>
        <div class="progress-bar-row">
            <span>진행 현황</span>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span>${doneCount}/${targetStudents.length} 완료</span>
        </div>
    </div>`;

    const visibleTeachers = currentTeacher === "ALL"
        ? teachers
        : teachers.filter(t => t.name === currentTeacher);

    for (const t of visibleTeachers) {
        const tStudents = schoolStudents.filter(s => s.teacher === t.name);
        html += `
        <div class="teacher-section-header">
            <h2>📌 ${t.name} 선생님 · 배정 학생 ${tStudents.length}명</h2>
        </div>
        <div class="cards-grid">
            ${tStudents.map(s => renderSingleConsultCard(s)).join("")}
        </div>`;
    }

    container.innerHTML = html;
}

function renderSingleConsultCard(s) {
    const done = isDone(s.id);
    const hasQ = s.question && s.question !== "-" && !["없습니다", "없습니당", "없음"].includes(s.question.trim());
    const memoVal = escapeHtml(getMemo(s.id));

    return `
    <div class="consult-card ${done ? 'done' : ''}">
        <div class="card-top">
            <div class="student-head">
                <span class="slot-pill">${s.slot}순번</span>
                <span class="student-title">${escapeHtml(s.name)}</span>
                <span class="student-classno">3학년 ${s.class}반 ${s.no}번</span>
            </div>
            <button type="button" class="done-toggle ${done ? 'checked' : ''}" onclick="toggleDone('${s.id}')">
                ${done ? '✅ 상담 완료' : '⬜ 완료 체크'}
            </button>
        </div>

        <div class="track-row">
            <span class="track-badge ${getTrackClass(s.track)}">${escapeHtml(s.track)}</span>
        </div>

        <div class="info-block">
            <div class="info-row">
                <span class="info-key">🎯 희망 진로·학과</span>
                <span class="job-highlight">${escapeHtml(s.job || '미정')}</span>
            </div>
            <div class="info-row">
                <span class="info-key">💭 주요 관심사</span>
                <span>${escapeHtml(s.worries || '-')}</span>
            </div>
        </div>

        ${hasQ ? `
        <div class="question-box">
            <span class="question-label">💬 학생 사전 질문</span>
            ${escapeHtml(s.question)}
        </div>` : `
        <div class="question-box empty">
            별도 기재한 사전 질문 없음 (${escapeHtml(s.question)})
        </div>`}

        <textarea class="memo-input" rows="2" placeholder="상담 키워드·추천 선택과목 메모 (서버 실시간 자동 연동)" oninput="saveMemo('${s.id}', this.value)">${memoVal}</textarea>
    </div>`;
}

// ================= 뷰 2: 전체 배정표 & 대기실 안내 =================
function renderOverviewView(container) {
    const teachers = getSchoolTeachers(currentSchool);
    const schoolStudents = getSchoolStudents(currentSchool);

    let html = `
    <div class="subview-bar">
        <div class="subview-pills">
            <button type="button" class="subview-pill ${overviewSubmode === 'booth' ? 'active' : ''}" onclick="overviewSubmode='booth'; renderView();">
                🏢 상담부스(교사)별 순번표
            </button>
            <button type="button" class="subview-pill ${overviewSubmode === 'table' ? 'active' : ''}" onclick="overviewSubmode='table'; renderView();">
                📑 반·번호순 전체 명렬표
            </button>
        </div>
        ${overviewSubmode === 'table' ? `
        <input type="search" class="search-input" placeholder="학생 이름, 반, 교사명 검색..." value="${escapeHtml(rosterSearchQuery)}" oninput="rosterSearchQuery=this.value; renderRosterTableBody();">
        ` : ''}
    </div>`;

    if (overviewSubmode === "booth") {
        html += `<div class="booth-grid">
            ${teachers.map((t, idx) => {
                const list = schoolStudents.filter(s => s.teacher === t.name);
                return `
                <div class="booth-card">
                    <div class="booth-head">
                        <div>
                            <div class="booth-teacher">${t.name} 선생님</div>
                            <div style="font-size:12px; opacity:0.85;">배정 학생 ${list.length}명</div>
                        </div>
                        <span class="booth-num">${escapeHtml(getRoomName(currentSchool, t.name))}</span>
                    </div>
                    <div class="booth-list">
                        ${list.map(s => `
                        <div class="booth-slot-item">
                            <span class="booth-slot-no">${s.slot}순번</span>
                            <div class="booth-st-info">
                                <span class="booth-st-name">${escapeHtml(s.name)}</span>
                                <span class="booth-st-class">3-${s.class} (${s.no}번)</span>
                            </div>
                        </div>`).join("")}
                    </div>
                </div>`;
            }).join("")}
        </div>`;
        container.innerHTML = html;
    } else {
        html += `
        <div class="table-card">
            <table class="roster-table">
                <thead>
                    <tr>
                        <th>반</th>
                        <th>번호</th>
                        <th>학생 성명</th>
                        <th>배정 교사</th>
                        <th>상담 순번</th>
                        <th>관심 진로 계열</th>
                        <th>희망 직업 / 학과</th>
                        <th>사전 질문</th>
                    </tr>
                </thead>
                <tbody id="rosterTableBody"></tbody>
            </table>
        </div>`;
        container.innerHTML = html;
        renderRosterTableBody();
    }
}

function renderRosterTableBody() {
    const tbody = document.getElementById("rosterTableBody");
    if (!tbody) return;
    const q = rosterSearchQuery.trim().toLowerCase();
    const sorted = getSchoolStudents(currentSchool)
        .slice()
        .sort((a, b) => a.class - b.class || a.no - b.no);

    const filtered = q
        ? sorted.filter(s =>
            s.name.toLowerCase().includes(q) ||
            s.teacher.toLowerCase().includes(q) ||
            `${s.class}반`.includes(q) ||
            s.track.toLowerCase().includes(q) ||
            s.job.toLowerCase().includes(q))
        : sorted;

    tbody.innerHTML = filtered.map(s => `
        <tr>
            <td class="td-center">${s.class}반</td>
            <td class="td-center">${s.no}번</td>
            <td class="td-center"><strong>${escapeHtml(s.name)}</strong></td>
            <td class="td-center"><strong style="color:var(--navy);">${escapeHtml(s.teacher)} 선생님</strong></td>
            <td class="td-center"><span class="booth-slot-no">${s.slot}순번</span></td>
            <td><span class="track-badge ${getTrackClass(s.track)}">${escapeHtml(s.track)}</span></td>
            <td>${escapeHtml(s.job)}</td>
            <td style="max-width:340px;">${escapeHtml(s.question)}</td>
        </tr>
    `).join("");
}

// ================= 뷰 3: 배정 편집 모드 (B안: 맞바꾸기·이동·순번조정) =================
function renderEditView(container) {
    const teachers = getSchoolTeachers(currentSchool);
    const schoolStudents = getSchoolStudents(currentSchool);
    const selStudent = selectedStudentId ? studentsData.find(s => s.id === selectedStudentId) : null;

    let guideMsg = `💡 <strong>배정 수정 방법:</strong> 학생 카드를 <strong>클릭</strong>한 뒤 다른 학생을 클릭하면 <strong>1:1 맞바꾸기</strong>가 되며, 다른 선생님의 <strong>[+ 이 팀으로 이동]</strong> 버튼을 누르면 소속 팀이 바뀝니다. (PC에서는 마우스 드래그 앤 드롭도 지원합니다)`;
    if (selStudent) {
        guideMsg = `👉 현재 선택됨: <strong>[${selStudent.teacher} 팀 ${selStudent.slot}순번] ${selStudent.class}반 ${selStudent.no}번 ${escapeHtml(selStudent.name)}</strong> — 맞바꿀 다른 학생을 클릭하거나, 이동할 선생님 팀을 선택하세요! <button type="button" class="mini-btn" style="margin-left:8px; padding:3px 8px;" onclick="selectedStudentId=null; renderView();">선택 취소</button>`;
    }

    let html = `
    <div class="edit-guide-banner">
        <div>${guideMsg}</div>
    </div>
    <div class="edit-board">
        ${teachers.map(t => {
            const list = schoolStudents.filter(s => s.teacher === t.name);
            const canMoveHere = selStudent && selStudent.teacher !== t.name;
            return `
            <div class="edit-col"
                 ondragover="handleColDragOver(event)"
                 ondragleave="handleColDragLeave(event)"
                 ondrop="handleColDrop(event, '${t.name}')">
                <div class="edit-col-head">
                    <div>
                        <span class="edit-col-title">${t.name} 선생님</span>
                    </div>
                    <span class="edit-col-cnt">${list.length}명</span>
                </div>
                <div class="edit-student-list">
                    ${list.map((s, i) => {
                        const isSel = s.id === selectedStudentId;
                        const hasQ = s.question && s.question !== "-";
                        return `
                        <div class="edit-st-card ${isSel ? 'selected' : ''}"
                             draggable="true"
                             ondragstart="handleCardDragStart(event, '${s.id}')"
                             ondrop="handleCardDrop(event, '${s.id}')"
                             onclick="handleEditCardClick(event, '${s.id}')">
                            <div class="edit-st-top">
                                <span class="edit-st-main">
                                    <span class="edit-slot-tag">${s.slot}</span>${s.class}-${s.no} ${escapeHtml(s.name)}
                                </span>
                                <div class="reorder-btns">
                                    <button type="button" class="mini-btn" title="순번 위로" onclick="moveSlotUpDown(event, '${s.id}', -1)" ${i === 0 ? 'disabled' : ''}>▲</button>
                                    <button type="button" class="mini-btn" title="순번 아래로" onclick="moveSlotUpDown(event, '${s.id}', 1)" ${i === list.length - 1 ? 'disabled' : ''}>▼</button>
                                </div>
                            </div>
                            <div class="edit-st-meta">
                                <span class="track-badge ${getTrackClass(s.track)}" style="font-size:11px; padding:2px 6px;">${escapeHtml(s.track.split(' ')[0] + ' ' + (s.track.split(' ')[1] || ''))}</span>
                                <span>희망: <strong>${escapeHtml(s.job)}</strong></span>
                            </div>
                            ${hasQ ? `<div class="edit-q-preview">💬 ${escapeHtml(s.question)}</div>` : ''}
                        </div>`;
                    }).join("")}
                </div>
                <button type="button" class="move-here-btn ${canMoveHere ? 'visible' : ''}" onclick="moveSelectedToTeacher('${t.name}')">
                    ➕ 선택한 학생을 ${t.name} 선생님 팀으로 이동
                </button>
            </div>`;
        }).join("")}
    </div>`;

    container.innerHTML = html;
}

function handleEditCardClick(e, targetId) {
    e.stopPropagation();
    if (!selectedStudentId) {
        selectedStudentId = targetId;
        renderView();
        return;
    }
    if (selectedStudentId === targetId) {
        selectedStudentId = null;
        renderView();
        return;
    }
    swapTwoStudents(selectedStudentId, targetId);
    selectedStudentId = null;
    renderAll();
}

function swapTwoStudents(idA, idB) {
    const a = studentsData.find(s => s.id === idA);
    const b = studentsData.find(s => s.id === idB);
    if (!a || !b || a.school !== b.school) return;

    const tmpTeacher = a.teacher;
    const tmpSlot = a.slot;

    a.teacher = b.teacher;
    a.slot = b.slot;

    b.teacher = tmpTeacher;
    b.slot = tmpSlot;

    normalizeAllSlots();
    showToast(`🔄 ${a.name} 학생과 ${b.name} 학생의 배정을 맞바꾸었습니다.`);
}

function moveSelectedToTeacher(targetTeacherName) {
    if (!selectedStudentId) return;
    moveStudentToTeacher(selectedStudentId, targetTeacherName);
    selectedStudentId = null;
    renderAll();
}

function moveStudentToTeacher(studentId, targetTeacherName) {
    const st = studentsData.find(s => s.id === studentId);
    const tObj = TEACHERS.find(t => t.name === targetTeacherName);
    if (!st || !tObj || st.teacher === targetTeacherName) return;

    st.teacher = targetTeacherName;
    st.slot = 999;
    normalizeAllSlots();
    showToast(`➡️ ${st.name} 학생을 ${targetTeacherName} 선생님 팀으로 이동했습니다.`);
}

function moveSlotUpDown(e, studentId, dir) {
    e.stopPropagation();
    const st = studentsData.find(s => s.id === studentId);
    if (!st) return;
    const team = studentsData
        .filter(s => s.school === st.school && s.teacher === st.teacher)
        .sort((a, b) => a.slot - b.slot);
    const idx = team.findIndex(s => s.id === studentId);
    const nxtIdx = idx + dir;
    if (nxtIdx < 0 || nxtIdx >= team.length) return;

    const other = team[nxtIdx];
    const tmp = st.slot;
    st.slot = other.slot;
    other.slot = tmp;
    normalizeAllSlots();
    renderAll();
}

// 드래그 앤 드롭 핸들러
function handleCardDragStart(e, id) {
    draggedStudentId = id;
    e.dataTransfer.effectAllowed = "move";
}
function handleColDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add("drag-over");
}
function handleColDragLeave(e) {
    e.currentTarget.classList.remove("drag-over");
}
function handleCardDrop(e, targetId) {
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll(".edit-col").forEach(el => el.classList.remove("drag-over"));
    if (draggedStudentId && draggedStudentId !== targetId) {
        swapTwoStudents(draggedStudentId, targetId);
        selectedStudentId = null;
        renderAll();
    }
    draggedStudentId = null;
}
function handleColDrop(e, teacherName) {
    e.preventDefault();
    e.currentTarget.classList.remove("drag-over");
    if (draggedStudentId) {
        moveStudentToTeacher(draggedStudentId, teacherName);
        selectedStudentId = null;
        renderAll();
    }
    draggedStudentId = null;
}

// 초기 구동
renderAll();
syncFromGoogleSheet(false);
</script>
