<!DOCTYPE html>
<html lang="ko">

    <style>
        :root {
            --navy: #1e3a8a;
            --navy-dark: #0f172a;
            --blue: #2563eb;
            --blue-light: #eff6ff;
            --blue-border: #bfdbfe;
            --teal: #0f766e;
            --teal-light: #f0fdfa;
            --amber: #d97706;
            --amber-light: #fffbeb;
            --green: #15803d;
            --green-light: #f0fdf4;
            --rose: #e11d48;
            --gray-900: #0f172a;
            --gray-800: #1e293b;
            --gray-700: #334155;
            --gray-600: #475569;
            --gray-500: #64748b;

            --gray-50: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 430px;
            border-radius: 22px;
            padding: 36px 32px 32px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .login-badge {
            display: inline-block;
            background: var(--blue-light);
            color: var(--navy);
            font-size: 12.5px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        .login-card h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .login-card p {

        .field-label {
            display: block;
            font-size: 13px;

            font-weight: 800;

        }
        .name-input::placeholder {
            font-weight: 500;
            color: #94a3b8;

        }
        .name-input:focus {

        }
        .code-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 10px;
            text-align: center;
            border: 2px solid var(--gray-300);
            border-radius: 12px;
            outline: none;
            transition: all 0.15s;
        }
        .code-input::placeholder {
            letter-spacing: 6px;
            color: #94a3b8;
        }
        .code-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--gray-600);
            cursor: pointer;

        .login-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--navy);
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s;

        .login-btn:hover {
            background: var(--blue);
        }
        .login-error {
            color: var(--rose);
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            min-height: 20px;
        }

        .app-shell {
            display: none;
        }

        .top-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #ffffff;
            padding: 16px 20px 14px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.18);
        }
        .header-inner {
            max-width: 1340px;
            margin: 0 auto;
        }
        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .brand-pill {
            background: rgba(255, 255, 255, 0.16);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }
        .brand-title h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }
        .sync-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .teacher-user-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fef08a;
            color: #0f172a;
            font-size: 13px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 999px;
        }
        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: #e2e8f0;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .school-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;

            gap: 7px;

        .school-tab:hover {

            color: #ffffff;

            color: var(--navy-dark);

        .school-tab .cnt {

            border-radius: 999px;
            background: rgba(15, 23, 42, 0.12);
        }
        .school-tab.active .cnt {
            background: var(--blue-light);
            color: var(--blue);
        }

        .main-wrap {
            max-width: 1340px;
            margin: 0 auto;
            padding: 20px;
        }

        .summary-banner {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);

        .summary-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

        .summary-left {

            align-items: center;

            font-size: 18.5px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .summary-meta {
            font-size: 13.2px;
            color: var(--gray-600);
            margin-top: 2px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-700);

        .btn:hover {
            background: var(--gray-50);

            align-items: center;
            gap: 10px;
            font-size: 12.8px;
            color: var(--gray-600);
            font-weight: 700;
        }
        .progress-track {
            flex: 1;
            height: 9px;
            background: var(--gray-200);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            border-radius: 999px;
            transition: width 0.25s;
        }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
        }
        @media (max-width: 500px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .consult-card {
            background: #ffffff;
            border: 1.5px solid var(--gray-200);
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 11px;
            transition: all 0.15s;
        }
        .consult-card.done {
            background: #f8fafc;
            border-color: #86efac;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .student-head {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .slot-pill {
            background: var(--navy);
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 7px;
        }
        .student-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .student-classno {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--gray-600);
        }
        .done-toggle {
            border: 1.5px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-600);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        .done-toggle.checked {
            background: var(--green-light);
            border-color: #22c55e;
            color: var(--green);
        }

        .track-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .track-t1 { background: #eff6ff; color: #1d4ed8; }
        .track-t2 { background: #ecfeff; color: #0e7490; }
        .track-t3 { background: #f0fdf4; color: #15803d; }
        .track-t4 { background: #fdf2f8; color: #be185d; }
        .track-t5 { background: #f5f3ff; color: #6d28d9; }
        .track-t6 { background: #fff7ed; color: #c2410c; }
        .track-t7 { background: #f1f5f9; color: #475569; }

        .info-block {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13.2px;
        }
        .info-row {
            margin-bottom: 6px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-key {
            font-weight: 800;
            color: var(--gray-600);
            margin-right: 6px;
        }
        .job-highlight {
            font-weight: 800;
            color: var(--navy);
        }

        .question-box {
            background: var(--amber-light);
            border: 1.5px solid #fde68a;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13.5px;
            color: #78350f;
        }
        .question-box.empty {
            background: var(--gray-50);
            border: 1px dashed var(--gray-300);
            color: var(--gray-500);
            padding: 8px 12px;
            font-size: 12.5px;
        }
        .question-label {
            display: block;
            font-size: 11.8px;
            font-weight: 800;
            color: #b45309;
            margin-bottom: 4px;
        }

        /* 서버 동기화 메모 영역 */
        .memo-wrap {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: auto;
        }
        .memo-input {
            width: 100%;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12.8px;
            font-family: inherit;
            background: #ffffff;
            color: var(--gray-800);
            resize: vertical;
            min-height: 44px;
            transition: border-color 0.15s;
        }
        .memo-input:focus {
            outline: none;
            border-color: var(--blue);
            background: #f8fafc;
        }
        .memo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .memo-status {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--gray-500);
        }
        .memo-status.synced { color: var(--green); }
        .memo-status.dirty { color: var(--amber); }
        .memo-status.saving { color: var(--blue); }
        .memo-status.error { color: var(--rose); }
        .memo-save-btn {
            border: 1px solid var(--blue-border);
            background: var(--blue-light);
            color: var(--blue);
            font-size: 11.5px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .memo-save-btn:hover {
            background: #dbeafe;
        }

        .empty-school-box {
            background: #ffffff;
            border: 1px dashed var(--gray-300);
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: var(--gray-500);
            font-weight: 700;
        }

        .toast {
            position: fixed;
            top: 110px;
            right: 20px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }

        @media print {
            body { background: #ffffff !important; }
            .login-screen, .top-header, .btn, .done-toggle, .memo-footer, .progress-bar-row {
                display: none !important;
            }
            .app-shell { display: block !important; }
            .main-wrap { padding: 0 !important; max-width: 100% !important; }
            .summary-banner { box-shadow: none !important; border: 1.5px solid #334155 !important; margin-bottom: 12px !important; }

            .cards-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
        }
    </style>
</head>

<!-- 1. 메인 입장 화면: 선생님 본인 성함 + 접속 코드 입력 -->
<section id="loginScreen" class="login-screen">
    <div class="login-card">
        <span class="login-badge">👩‍🏫 마산내서여자고등학교 컨설팅단 전용</span>
        <h1>교사용 1:1 상담 카드 조회</h1>
        <p>선생님 성함을 입력하시면<br><strong>선생님께 배정된 학생 상담 카드</strong>만 바로 열립니다.</p>
        <form onsubmit="handleTeacherLogin(event)">
            <div class="field-group">
                <label class="field-label" for="teacherNameInput">선생님 성함</label>
                <input type="text" id="teacherNameInput" class="name-input" placeholder="성함을 입력하세요 (예: 홍길동)" autocomplete="off" autofocus>

            <label class="login-remember">

            <button type="submit" class="login-btn">내 상담 카드 열기</button>
        </form>
    </div>
</section>

<!-- 2. 로그인 후 개인 전용 상담 카드 화면 -->
<div id="appShell" class="app-shell">

        <div class="header-inner">
            <div class="header-top-row">
                <div class="brand-title">
                    <span class="brand-pill">마산내서여고 교육과정부</span>

        <div class="summary-banner">
            <div class="summary-top">
                <div class="summary-left">

                    <span id="bannerRoom" class="room-highlight-chip"></span>
                    <div>
                        <div id="bannerTitle" class="summary-title"></div>

</div>

let studentsData = JSON.parse(JSON.stringify(INITIAL_STUDENTS));
let loggedInTeacher = "";
let currentSchool = "";

// 서버 동기화 상태: { [studentId]: { done: boolean, memo: string } }
function safeGetLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSetLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function safeDelLocal(k) { try { localStorage.removeItem(k); } catch (e) {} }
function safeGetSession(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function safeSetSession(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function safeDelSession(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

let serverRecords = {};
const memoTimers = {};

function loadPendingBuffer() {
    try {
        return JSON.parse(localStorage.getItem("expo_pending_memos") || "{}");
    } catch (e) {
        return {};
    }
}
function savePendingBuffer(buf) {
    try {
        localStorage.setItem("expo_pending_memos", JSON.stringify(buf));
    } catch (e) {}
}

function getEffectiveRecord(studentId) {
    const pending = loadPendingBuffer()[studentId];
    const srv = serverRecords[studentId] || { done: false, memo: "" };
    // 최근 25초 이내 방금 저장한 내역은 시트 수식 반영 지연 동안 우선 표시
    if (pending && (Date.now() - pending.ts < 25000)) {
        return { done: !!pending.done, memo: String(pending.memo || "") };
    }
    return srv;
}

function getRoomName(school, teacher) {
    return (ROOM_MAP[school] && ROOM_MAP[school][teacher]) || "상담실";
}

function normalizeTeacherInput(raw) {
    return String(raw || "")
        .replace(/선생님/g, "")
        .replace(/교사/g, "")
        .replace(/쌤/g, "")
        .replace(/\s+/g, "")
        .trim();
}

function findTeacherByName(raw) {
    const norm = normalizeTeacherInput(raw);
    if (!norm) return null;
    return TEACHERS.find(t => t.name === norm) || null;
}

function getMySchools(teacherName) {
    const tObj = TEACHERS.find(t => t.name === teacherName);
    return SCHOOL_ORDER.filter(sc =>
        (tObj && tObj.schools[sc]) ||
        studentsData.some(s => s.school === sc && s.teacher === teacherName)
    );
}

function initAuth() {
    const savedName = safeGetLocal("expo_my_teacher_name") || safeGetSession("expo_my_teacher_name") || "";
    const found = findTeacherByName(savedName);

    if (found) {
        enterTeacherView(found.name, false);
    } else {
        showLoginScreen();
    }
}

function showLoginScreen() {
    loggedInTeacher = "";
    document.getElementById("appShell").style.display = "none";
    document.getElementById("cardsContainer").innerHTML = "";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("loginError").textContent = "";
    setTimeout(() => document.getElementById("teacherNameInput").focus(), 50);
}

function handleTeacherLogin(e) {
    e.preventDefault();
    const rawName = document.getElementById("teacherNameInput").value;
    const errEl = document.getElementById("loginError");

    const found = findTeacherByName(rawName);
    if (!found) {
        errEl.textContent = "컨설팅 명단에 등록되지 않은 성함입니다. 성함을 확인해 주세요.";
        document.getElementById("teacherNameInput").focus();
        return;
    }

    const remember = document.getElementById("rememberLogin").checked;
    enterTeacherView(found.name, remember);
}

function enterTeacherView(teacherName, persistLocal) {
    loggedInTeacher = teacherName;
    safeSetSession("expo_my_teacher_name", teacherName);
    if (persistLocal) {
        safeSetLocal("expo_my_teacher_name", teacherName);
    }

    const mySchools = getMySchools(teacherName);
    const savedSchool = safeGetLocal(`expo_my_school_${teacherName}`);
    currentSchool = (savedSchool && mySchools.includes(savedSchool)) ? savedSchool : (mySchools[0] || "호계중");

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appShell").style.display = "block";
    renderAll();
}

function handleLogout() {
    safeDelLocal("expo_my_teacher_name");
    safeDelLocal("expo_my_teacher_auth");
    safeDelSession("expo_my_teacher_name");
    safeDelSession("expo_my_teacher_auth");
    document.getElementById("teacherNameInput").value = "";
    showLoginScreen();
}

function syncFromGoogleSheet(manualNotify = false) {
    const cbName = "__gvizMyCardCb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(() => {
        cleanup();
        setSyncStatus("내장 데이터 표시 중", false);
    }, 8000);

    function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(resp) {
        cleanup();
        try {
            if (!resp || resp.status !== "ok" || !resp.table || !resp.table.rows) throw new Error("Invalid");
            const parsed = [];
            const nextRecords = {};
            const pendingBuf = loadPendingBuffer();
            let pendingChanged = false;

            for (const rowObj of resp.table.rows) {
                const c = rowObj.c || [];
                const val = idx => (c[idx] && c[idx].v !== null && c[idx].v !== undefined) ? c[idx].v : "";
                const dateStr = String(val(0)).trim();
                const school = String(val(1)).trim();
                const teacher = String(val(2)).trim();
                const slot = Math.round(Number(val(3)) || 1);
                const sClass = Math.round(Number(val(4)) || 1);
                const sNo = Math.round(Number(val(5)) || 1);
                const name = String(val(6)).trim();
                const track = String(val(7)).trim();
                const job = String(val(8)).trim();
                const worries = String(val(9)).trim();
                const question = String(val(10)).trim() || "-";
                const id = String(val(11)).trim() || `${school}-${sClass}-${sNo}`;
                const doneCol = String(val(12)).trim();
                const memoCol = String(val(13) || "").replace(/^'/, "");

                if (school && name) {
                    parsed.push({ id, date: dateStr, school, teacher, slot, class: sClass, no: sNo, name, track, job, worries, question });
                    const srvDone = (doneCol === "완료");
                    nextRecords[id] = { done: srvDone, memo: memoCol };

                    if (pendingBuf[id] && pendingBuf[id].done === srvDone && pendingBuf[id].memo === memoCol) {
                        delete pendingBuf[id];
                        pendingChanged = true;
                    }
                }
            }
            if (pendingChanged) savePendingBuffer(pendingBuf);

            if (parsed.length > 0) {
                studentsData = parsed;
                serverRecords = nextRecords;
                // 입력 중인 메모창이 없을 때만 카드 전체 재렌더링 (한글 조합 끊김 방지)
                const activeEl = document.activeElement;
                if (loggedInTeacher && (!activeEl || !activeEl.classList.contains("memo-input"))) {
                    renderAll();
                }
                setSyncStatus("구글 시트 실시간 연동됨", true);
                if (manualNotify) showToast("✅ 서버에서 최신 배정 및 상담 메모를 불러왔습니다.");
            }
        } catch (err) {
            setSyncStatus("기본 데이터 표시 중", false);
        }
    };

    script.onerror = function() {
        cleanup();
        setSyncStatus("오프라인 백업 데이터 사용 중", false);
    };
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&gid=${MATCH_GID}&_ts=${Date.now()}`;
    document.body.appendChild(script);
}

function setSyncStatus(msg, ok) {
    document.getElementById("syncStatusText").textContent = msg;
    document.getElementById("syncStatusBadge").style.background = ok ? "rgba(16, 185, 129, 0.2)" : "rgba(245, 158, 11, 0.22)";
}

// ================= 서버 실시간 저장 (상담 완료 + 메모) =================
function sanitizeForSheetCell(text) {
    const str = String(text || "").trim();
    if (!str) return "";
    // -, +, =, @ 로 시작하는 메모가 수식으로 오인되지 않도록 작은따옴표 이스케이프
    if (/^[=+\-@']/.test(str)) {
        return "'" + str;
    }
    return str;
}

function setMemoStatusUI(studentId, state, label) {
    const el = document.getElementById(`memoStatus_${studentId}`);
    if (!el) return;
    el.className = `memo-status ${state}`;
    el.textContent = label;
}

async function pushRecordToServer(studentId, doneVal, memoVal, showToastOnDone = false) {
    const cleanMemo = String(memoVal || "").trim();
    const cur = getEffectiveRecord(studentId);
    serverRecords[studentId] = { done: !!doneVal, memo: cleanMemo };

    const buf = loadPendingBuffer();
    buf[studentId] = { done: !!doneVal, memo: cleanMemo, ts: Date.now() };
    savePendingBuffer(buf);

    setMemoStatusUI(studentId, "saving", "⏳ 서버에 저장 중...");

    const payload = {
        name: "상담메모",
        subject: studentId,
        participation: doneVal ? "완료" : "미완료",
        schools: doneVal ? "완료" : "미완료",
        track: sanitizeForSheetCell(cleanMemo)
    };

    try {
        await fetch(MEMO_SYNC_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        });
        setMemoStatusUI(studentId, "synced", "☁️ 서버 저장됨 (모든 기기 자동 연동)");
        if (showToastOnDone) showToast("☁️ 상담 메모가 서버에 저장되었습니다.");
    } catch (err) {
        setMemoStatusUI(studentId, "error", "⚠️ 네트워크 오류 (다시 [저장]을 눌러주세요)");
    }
}

function handleMemoInput(studentId, val) {
    setMemoStatusUI(studentId, "dirty", "✏️ 작성 중... (잠시 후 서버에 자동 저장)");
    clearTimeout(memoTimers[studentId]);
    memoTimers[studentId] = setTimeout(() => {
        const rec = getEffectiveRecord(studentId);
        pushRecordToServer(studentId, rec.done, val, false);
    }, 1200);
}

function handleMemoBlur(studentId, val) {
    if (memoTimers[studentId]) {
        clearTimeout(memoTimers[studentId]);
        delete memoTimers[studentId];
        const rec = getEffectiveRecord(studentId);
        pushRecordToServer(studentId, rec.done, val, false);
    }
}

function handleManualMemoSave(studentId) {
    clearTimeout(memoTimers[studentId]);
    delete memoTimers[studentId];
    const textarea = document.getElementById(`memoInput_${studentId}`);
    const val = textarea ? textarea.value : getEffectiveRecord(studentId).memo;
    const rec = getEffectiveRecord(studentId);
    pushRecordToServer(studentId, rec.done, val, true);
}

function toggleDone(studentId) {
    const textarea = document.getElementById(`memoInput_${studentId}`);
    const currentMemo = textarea ? textarea.value : getEffectiveRecord(studentId).memo;
    const nextDone = !getEffectiveRecord(studentId).done;

    const card = document.getElementById(`card_${studentId}`);
    const btn = document.getElementById(`doneBtn_${studentId}`);
    if (card) card.classList.toggle("done", nextDone);
    if (btn) {
        btn.classList.toggle("checked", nextDone);
        btn.textContent = nextDone ? "✅ 상담 완료" : "⬜ 완료 체크";
    }

    pushRecordToServer(studentId, nextDone, currentMemo, false);
    updateProgressHeaderOnly();
}

function updateProgressHeaderOnly() {
    const myStudents = studentsData.filter(s => s.school === currentSchool && s.teacher === loggedInTeacher);
    const doneCount = myStudents.filter(s => getEffectiveRecord(s.id).done).length;
    const pct = myStudents.length ? Math.round((doneCount / myStudents.length) * 100) : 0;
    document.getElementById("progressFill").style.width = `${pct}%`;
    document.getElementById("progressText").textContent = `${doneCount} / ${myStudents.length}명 완료 (${pct}%)`;
}

function getTrackClass(track) {
    if (track.includes("①")) return "track-t1";
    if (track.includes("②")) return "track-t2";
    if (track.includes("③")) return "track-t3";
    if (track.includes("④")) return "track-t4";
    if (track.includes("⑤")) return "track-t5";
    if (track.includes("⑥")) return "track-t6";
    return "track-t7";
}

function escapeHtml(str) {
    return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function selectSchool(sc) {
    currentSchool = sc;
    if (loggedInTeacher) {
        safeSetLocal(`expo_my_school_${loggedInTeacher}`, sc);
    }
    renderAll();
}

function renderAll() {
    if (!loggedInTeacher) return;

    const mySchools = getMySchools(loggedInTeacher);
    if (!mySchools.includes(currentSchool)) {
        currentSchool = mySchools[0] || "호계중";
    }

    document.getElementById("headerTitle").textContent = `${loggedInTeacher} 선생님 · 1:1 컨설팅 상담 카드`;
    document.getElementById("teacherUserBadge").textContent = `👩‍🏫 ${loggedInTeacher} 선생님`;

    document.getElementById("schoolTabs").innerHTML = mySchools.map(sc => {
        const myCnt = studentsData.filter(s => s.school === sc && s.teacher === loggedInTeacher).length;
        const info = SCHOOL_INFO[sc];
        return `<button type="button" class="school-tab ${sc === currentSchool ? 'active' : ''}" onclick="selectSchool('${sc}')">
            ${info.date} ${sc} <span class="cnt">내 배정 ${myCnt}명</span>
        </button>`;
    }).join("");

    const info = SCHOOL_INFO[currentSchool];
    const roomName = getRoomName(currentSchool, loggedInTeacher);
    const myStudents = studentsData
        .filter(s => s.school === currentSchool && s.teacher === loggedInTeacher)
        .sort((a, b) => a.slot - b.slot);

    document.getElementById("bannerDate").textContent = `📅 ${info.date} ${info.time}`;
    document.getElementById("bannerRoom").textContent = `📍 배정 교실: ${roomName}`;
    document.getElementById("bannerTitle").textContent = `${info.fullName} · ${loggedInTeacher} 선생님 담당 학생 (${myStudents.length}명)`;
    document.getElementById("bannerMeta").textContent = `학생 집결 대기실: ${info.waitingRoom} · 메모·완료 체크는 서버에 실시간 저장되어 모든 기기에서 연동됩니다`;

    updateProgressHeaderOnly();

    const container = document.getElementById("cardsContainer");
    if (myStudents.length === 0) {
        container.innerHTML = `<div class="empty-school-box">이 학교에 배정된 학생이 없습니다.</div>`;
        return;
    }

    container.innerHTML = `<div class="cards-grid">
        ${myStudents.map(s => renderSingleConsultCard(s)).join("")}
    </div>`;
}

function renderSingleConsultCard(s) {
    const rec = getEffectiveRecord(s.id);
    const done = rec.done;
    const memoVal = escapeHtml(rec.memo);
    const hasMemo = Boolean(rec.memo && rec.memo.trim());
    const hasQ = s.question && s.question !== "-" && !["없습니다", "없습니당", "없음"].includes(s.question.trim());

    return `
    <div id="card_${s.id}" class="consult-card ${done ? 'done' : ''}">
        <div class="card-top">
            <div class="student-head">
                <span class="slot-pill">${s.slot}순번</span>
                <span class="student-title">${escapeHtml(s.name)}</span>
                <span class="student-classno">3학년 ${s.class}반 ${s.no}번</span>
            </div>
            <button type="button" id="doneBtn_${s.id}" class="done-toggle ${done ? 'checked' : ''}" onclick="toggleDone('${s.id}')">
                ${done ? '✅ 상담 완료' : '⬜ 완료 체크'}
            </button>
        </div>

        <div>
            <span class="track-badge ${getTrackClass(s.track)}">${escapeHtml(s.track)}</span>
        </div>

        <div class="info-block">
            <div class="info-row">
                <span class="info-key">🎯 희망 진로·학과</span>
                <span class="job-highlight">${escapeHtml(s.job || '미정')}</span>
            </div>
            <div class="info-row">
                <span class="info-key">💭 주요 관심사</span>
                <span>${escapeHtml(s.worries || '-')}</span>
            </div>
        </div>

        ${hasQ ? `
        <div class="question-box">
            <span class="question-label">💬 학생 사전 질문</span>
            ${escapeHtml(s.question)}
        </div>` : `
        <div class="question-box empty">
            별도 기재한 사전 질문 없음 (${escapeHtml(s.question)})
        </div>`}

        <div class="memo-wrap">
            <textarea id="memoInput_${s.id}" class="memo-input" rows="2" placeholder="상담 키워드·추천 선택과목 메모 (작성 후 자동 서버 저장)" oninput="handleMemoInput('${s.id}', this.value)" onblur="handleMemoBlur('${s.id}', this.value)">${memoVal}</textarea>
            <div class="memo-footer">
                <span id="memoStatus_${s.id}" class="memo-status ${hasMemo || done ? 'synced' : ''}">
                    ${hasMemo || done ? '☁️ 서버 저장됨 (모든 기기 자동 연동)' : '☁️ 입력 시 서버에 자동 저장됩니다'}
                </span>
                <button type="button" class="memo-save-btn" onclick="handleManualMemoSave('${s.id}')">💾 서버 저장</button>
            </div>
        </div>
    </div>`;
}

initAuth();
syncFromGoogleSheet(false);
</script>
